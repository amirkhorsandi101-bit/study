    <script>
      (function() {
        var suppress = function(str) {
          return str && (
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('@vite/client') !== -1 ||
            str.indexOf('createWebSocketModuleRunnerTransport') !== -1
          );
        };
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event.reason;
          var text = (reason && (reason.message || reason.stack || String(reason))) || '';
          if (suppress(text)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        window.addEventListener('error', function(event) {
          var text = (event.message || '') + (event.filename || '') + (event.error && event.error.stack ? event.error.stack : '');
          if (suppress(text)) {
            event.stopImmediatePropagation();
            event.preventDefault();
          }
        }, true);
        var origOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          var text = String(msg || '') + String(url || '') + (error && error.stack ? String(error.stack) : '');
          if (suppress(text)) {
            return true;
          }
          if (origOnError) return origOnError.apply(this, arguments);
        };
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 font-['Vazirmatn',sans-serif] antialiased selection:bg-amber-500/20 selection:text-amber-200 min-h-screen">
